<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="player-api" content="https://lucky-panda-2839.a.tuna.free">
  <title>ПРИЗРАК — Музыкальный плеер</title>
  <link rel="stylesheet" href="./style.css?v=25">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="access-locked">
<main inert>
  <header class="app-header">

    <nav aria-label="Плейлисты">
      <button data-list="wave" aria-pressed="true">Волна</button>
      <button data-list="favorites">Мои треки</button>
      <button data-list="top">Топ</button>
      <button data-list="search" id="tab-search" style="display:none">Поиск</button>
    </nav>

    <div class="top-volume">
      <button id="volume-toggle" class="vol-icon" aria-label="Регулировать громкость" aria-expanded="false" aria-controls="volume">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>
      <input id="volume" type="range" min="0" max="100" value="100" aria-label="Громкость">
    </div>
  </header>

  <section class="art">
    <div class="aura-container" id="aura-wrapper" title="Нажмите для воспроизведения/паузы">
      <canvas id="aura-canvas" width="340" height="340" aria-label="Аура трека"></canvas>
    </div>
  </section>

  <h1 id="title">Загрузка музыки…</h1>
  <p id="artist">ПРИЗРАК</p>
  <p id="status" role="status">Студийный звук • 320 kbps</p>
  <audio id="audio" preload="auto" playsinline></audio>

  <div class="seek-container">
    <div class="time-row">
      <output id="time">0:00</output>
      <output id="time-total">0:00</output>
    </div>
    <input id="seek" type="range" min="0" max="100" value="0" aria-label="Позиция">
  </div>


  <div class="controls">
    <button id="shuffle" aria-label="Перемешать" aria-pressed="false" title="Перемешать треки">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>
      </svg>
    </button>
    <button id="prev" aria-label="Предыдущий" title="Предыдущий трек">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
      </svg>
    </button>
    <button id="play" aria-label="Воспроизвести" title="Воспроизвести">
      <span id="play-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="7,4 20,12 7,20"/>
        </svg>
      </span>
    </button>
    <button id="next" aria-label="Следующий" title="Следующий трек">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
      </svg>
    </button>
    <button id="repeat" aria-label="Повтор" title="Режим повтора: выкл" aria-pressed="false" data-mode="off">
      <span id="repeat-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </span>
    </button>
    <button id="like" aria-label="В избранное" title="В избранное" aria-pressed="false">
      <span id="like-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </span>
    </button>
    <button id="download-tg" aria-label="Скачать трек" title="Скачать трек на устройство">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>

    <div class="search-bar">
      <input id="search-input" type="search" placeholder="Найти трек или артиста..." autocomplete="off">
      <button id="search-btn">Искать</button>
    </div>
  <section id="wave-locked" class="wave-locked" hidden aria-live="polite">
    <span class="wave-lock-symbol" aria-hidden="true">◌</span>
    <h2>Волна узнаёт ваш вкус</h2>
    <p id="wave-progress-text"></p>
    <progress id="wave-progress" max="15" value="0" aria-label="Треки для обучения Волны"></progress>
    <p>Добавляйте треки через поиск или бота.</p>
  </section>
  <h2 id="list-title">Очередь воспроизведения</h2>
  <ol id="queue"></ol>

  <!-- Модальное окно выбора способа скачивания -->
  <div id="dl-modal" class="modal-backdrop" aria-hidden="true" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Скачать трек</span>
        <button id="modal-close" class="modal-close-btn" aria-label="Закрыть">&times;</button>
      </div>
      <p id="modal-track-desc" class="modal-track-info">Загрузка информации…</p>
      <div class="modal-actions">
        <button id="btn-dl-device" class="modal-btn modal-btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <div class="modal-btn-content">
            <span class="btn-main">Скачать на устройство</span>
            <span class="btn-sub">Быстрое сохранение аудио в Загрузки</span>
          </div>
        </button>
        <button id="btn-dl-telegram" class="modal-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          <div class="modal-btn-content">
            <span class="btn-main">Получить в 320 kbps в Telegram</span>
            <span class="btn-sub">Полная студийная версия через бота</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-notice" aria-live="polite"></div>
</main>
<section id="access-gate" class="access-gate" role="dialog" aria-modal="true" aria-labelledby="access-title">
  <div class="access-card">
    <span aria-hidden="true">🎧</span>
    <h2 id="access-title">Твоя музыка. Твой вайб.</h2>
    <p id="access-message">Проверяем доступ к плееру…</p>
    <a id="access-buy" class="access-action" href="https://t.me/PR1ZRAKWORK_BOT?start=player_vip" hidden>⭐ Купить VIP</a>
    <button id="access-retry" hidden>Проверить доступ</button>
    <a class="access-return" href="https://t.me/PR1ZRAKWORK_BOT">Вернуться в бот</a>
  </div>
</section>
<script type="module" src="./app.js?v=25"></script>
</body>
</html>
